# Gitleaks configuration for PanelGuard
# Allowlist for false positives: documentation examples

[allowlist]
description = "Allowlist for documentation examples and synthetic test data"

# Documentation examples in README (showing what gitleaks can detect)
paths = [
  '''README\.md:sidekiq-secret:42''',
  '''README\.md:aws-access-token:221''',
  '''README\.md:aws-access-token:223''',
  '''README\.md:aws-access-token:259''',
]

# Synthetic test data patterns
regexes = [
  '''SYN-[A-Z]+-\d+''',  # Synthetic IDs (SYN-PAT-001, etc.)
  '''IH-\d+''',          # Internal case IDs
]
