name: Security evidence

# Supply-chain and SAST evidence for audits (ISO 27001 A.8.25-A.8.29 / NCA ECC / NIST SSDF).
# Report-only at first: findings are kept as artifacts; tighten to blocking once the baseline is clean.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 0"   # Sundays 06:00 Asia/Riyadh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit cyclonedx-bom

      - name: Dependency vulnerabilities (pip-audit, OSV database)
        continue-on-error: true
        run: |
          mkdir -p reports
          pip-audit -r apps/panelguard/requirements.txt -s osv -f json -o reports/pip-audit.json --progress-spinner off
          pip-audit -r apps/panelguard/requirements.txt -s osv --progress-spinner off

      - name: Static analysis (bandit)
        continue-on-error: true
        run: |
          bandit -r apps/panelguard/app apps/panelguard/engine apps/panelguard/agents -f json -o reports/bandit.json
          bandit -r apps/panelguard/app apps/panelguard/engine apps/panelguard/agents -ll

      - name: SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install -q -r apps/panelguard/requirements.txt
          cyclonedx-py environment /tmp/sbomenv/bin/python --output-format JSON --output-file reports/sbom-panelguard.cdx.json

      - name: Evidence summary
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > reports/evidence.txt
          ls -l reports

      - name: Upload evidence (90 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence-${{ github.sha }}
          path: reports/
          retention-days: 90
